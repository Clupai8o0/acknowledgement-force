<script>
(() => {
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const CSS_ = getComputedStyle(document.documentElement);
const TOK = n => CSS_.getPropertyValue('--' + n).trim();
const clamp01 = v => v < 0 ? 0 : v > 1 ? 1 : v;

/* ════════════════════════ Ink Bloom ════════════════════════
   D20 fixes the moment, the duration (~1.15 s) and "no stagger". It does not
   fix the SHAPE of the curve, and the shape is the whole complaint: on the
   house curve — cubic-bezier(.16,1,.3,1), an expo-out — 90% of the blur
   collapses in the first quarter of the duration, so a 1.15 s bloom is
   visually over in 280 ms.

   What replaces it holds the haze. `shape` blends a straight line into
   smoothstep into smootherstep; at the default the sentence is still 84% blurred
   a quarter of the way through and does not become readable until past halfway.
   `lead` runs the opacity clock slightly ahead of the focus clock, so the ink
   darkens a little before it sharpens — which is what ink does.

   Technique is DESIGN.md's: transparent fill plus a zero-offset shadow, so at
   blur 0 the shadow IS the glyph. The fill never fades in alongside the blur —
   that produces a glow, and it is the bug this started as. */
const B = { dur: 950, blurK: 1.30, shape: .55, lead: .12 };
/* one multiplier over every entrance stagger in the product, so the whole
   choreography can be dialled from nothing to twice as loose in one place */
const MOT = { stag: 1 };
const PROFILES = {
  now:    { dur: 950,  blurK: 1.30, shape: .55, lead: .12 },
  record: { dur: 1150, blurK: 1.30, shape: .55, lead: .12 },
  old:    { dur: 950,  blurK: 1.33, shape: 0,   lead: .55 },
};
/* the entrance duration, so JS can budget what CSS is actually doing */
const ARRIVE = 620;
const smoothstep   = t => t * t * (3 - 2 * t);
const smootherstep = t => t * t * t * (t * (t * 6 - 15) + 10);
function shaped(t) {
  const s = clamp01(t);
  if (B.shape <= .5) { const k = B.shape * 2; return s * (1 - k) + smoothstep(s) * k; }
  const k = (B.shape - .5) * 2; return smoothstep(s) * (1 - k) + smootherstep(s) * k;
}
const INK = TOK('ink');

/* HOW it is driven matters as much as the curve. A per-frame JS driver is the
   obvious way to make the shape tunable, and it is the wrong way: a throttled
   or backgrounded tab starves requestAnimationFrame completely, and a sentence
   parked at opacity 0 waiting for a frame that never comes is invisible. That
   failure looks exactly like "the bloom doesn't work" — which is where this
   started.

   So the curve is COMPILED into a real @keyframes rule, sixteen stops on a
   linear clock, and the browser runs it off the style engine. The blur is in
   `em`, so one rule serves a 21px claim and a 48px one without measuring
   anything. The tuner recompiles the rule; nothing else changes. */
const kf = document.createElement('style');
document.head.appendChild(kf);
const STOPS = 16;
function compileBloom() {
  let out = '';
  for (let i = 0; i <= STOPS; i++) {
    const t = i / STOPS, s = shaped(t);
    out += `${(t * 100).toFixed(2)}%{text-shadow:0 0 ${(B.blurK * (1 - s)).toFixed(4)}em var(--ink);`
         + `opacity:${clamp01(shaped(t * (1 + B.lead))).toFixed(3)}}`;
  }
  kf.textContent = `@keyframes inkbloom{${out}}`;
}

function endBloom(el) {
  clearTimeout(el._bt);
  el.style.animation = ''; el.style.animationPlayState = ''; el.style.animationDelay = '';
  el.classList.add('settled');
}
/* Reduce Motion suppresses motion that happens TO you. Pressing a button
   labelled "play it" is a request, not an ambush, so `force` overrides it. */
function bloom(el, force, delay = 0, ruleAt) {
  clearTimeout(el._rt);
  el.classList.add('bloom');
  el.classList.remove('settled');
  const rule = el.querySelector('[data-emph]');
  if (rule) rule.classList.remove('drawn');
  if (RM && !force) { endBloom(el); if (rule) rule.classList.add('drawn'); return; }
  el.style.animation = 'none';
  void el.offsetWidth;                     /* restart from the top */
  el.style.animationPlayState = ''; el.style.animationDelay = '';
  el.style.animation = `inkbloom ${B.dur}ms linear ${delay}ms both`;
  clearTimeout(el._bt);
  el._bt = setTimeout(() => endBloom(el), B.dur + 260);
  el.addEventListener('animationend', () => endBloom(el), { once: true });
  /* D20: the rule begins ~0.9 s AFTER the bloom settles. The gap is the point —
     the sentence lands and is read whole, then the app goes back over it and
     puts its finger on the half that today can break. */
  if (rule && ruleAt !== false)
    el._rt = setTimeout(() => rule.classList.add('drawn'),
      ruleAt === undefined ? delay + B.dur + RULE_GAP : ruleAt);
}
/* park the animation at a fraction of its timeline, so the curve can be looked
   at rather than only reasoned about */
function freezeBloom(el, f) {
  bloom(el, true);
  clearTimeout(el._bt);
  clearTimeout(el._rt);          /* a frozen frame must not grow a rule 2s later */
  el.querySelector('[data-emph]')?.classList.remove('drawn');
  el.style.animationPlayState = 'paused';
  el.style.animationDelay = `-${(f * B.dur).toFixed(0)}ms`;
}

/* ════════════════════════ the quiet arrivals ════════════════════════
   Everything that is not the sentence rises after it starts and before it
   finishes, so the screen composes while the claim is still a haze and the
   claim is the last thing to become legible. That ordering is the whole reason
   it does not read as a light show. */
/* ── the order of a screen ────────────────────────────────────────────────
   The sentence arrives first, ALONE, on an otherwise empty surface. Only when
   it has resolved does the rest of the screen compose around it, and only
   after that does the app underline the half that can be wrong.

   This costs nothing. D20 already spends 0.9s between the bloom settling and
   the rule drawing — the gap was always there and it was always empty. The
   composition now happens inside it, so the screen is complete at the same
   moment it was before. What changed is that the claim no longer shares its
   entrance with the furniture.

   SPREAD caps how long any one sweep may take, whatever it is sweeping: seven
   marks or forty. It used to be 340ms, which was the budget left over inside
   D20's 0.9s gap — and 340ms across forty marks is 8ms a mark, which is not a
   stagger, it is a flicker. The gap is a MINIMUM, not a schedule: D20 fixes
   that the rule comes after the sentence has landed and been read whole, and
   the rule now waits for the whole screen to finish composing instead of for a
   stopwatch. So the sweep gets the room it needs and the rule is still the last
   thing that happens. */
const SPREAD = 900, SETTLE_BEAT = 40, RULE_GAP = 900, RULE_AFTER_COMPOSE = 130;

function rises(scene, after) {
  /* a `.rise` inside a staggered container would animate twice, once as itself
     and once as one of its parent's children */
  const els = $$('.rise', scene).filter(el =>
    !el.closest('[data-stagger]') && (el.offsetParent !== null || el.offsetWidth));
  els.forEach(el => el.classList.remove('up'));
  if (RM) { els.forEach(el => el.classList.add('up')); return; }
  void scene.offsetWidth;
  const step = Math.min(95 * MOT.stag, SPREAD / Math.max(1, els.length - 1));
  els.forEach((el, i) => {
    el.style.transitionDelay = Math.round(after + i * step) + 'ms';
    el.classList.add('up');
  });
  return els.length ? (els.length - 1) * step + ARRIVE : 0;   /* + the transition */
}

/* ── stagger ──────────────────────────────────────────────────────────────
   Applied only where the order is information: a strip of days, a list of
   offers, a week of testimony. The claim is never in here — D20 rejected
   per-word stagger and gave the reason, and the reason still holds: a reveal
   you have already seen nineteen times is a wait.

   `data-from` is no longer a time. It is the beat this block takes in the
   composition, compressed into a fifth of a second so the whole screen starts
   filling at once and finishes in its intended order. */
function stagger(scene, after) {
  let end = 0;
  $$('[data-stagger]', scene).forEach(box => {
    if (box.hidden || !box.offsetParent) return;
    const kids = [...box.children];
    kids.forEach(k => { k.classList.remove('stag'); k.style.animationDelay = ''; });
    if (RM) return;
    /* a forty-mark strip and a three-row list get the same total sweep, so a
       long strip never outlasts the gap it has to fit inside */
    const step = Math.min((+box.dataset.stagger || 60) * MOT.stag,
                          SPREAD / Math.max(1, kids.length - 1));
    /* the blocks start close together — the per-item sweep inside each one is
       what carries the sequence now, so the beats only need to order them */
    const beat = ((+box.dataset.from || 300) - 260) * .3;
    void box.offsetWidth;
    kids.forEach((k, i) => {
      k.style.animationDelay = Math.round(after + beat + i * step) + 'ms';
      k.classList.add('stag');
    });
    end = Math.max(end, beat + (kids.length - 1) * step + ARRIVE); /* + the animation */
  });
  return end;
}

/* ════════════════════════ the voice line ════════════════════════
   PROPOSED — this replaces D20's layered ring and amends it. One line pinned at
   both ends. A carrier oscillation gives it the shape of a wave; your voice is
   its amplitude, read out of a rolling ~2.3 s history, so what you said half a
   second ago is still travelling along it. While it is alive the emphasis rule
   under the claim stands down, so there is still exactly one accent on screen. */
const HIST = 168;
class Line {
  constructor(cv) {
    this.cv = cv; this.ctx = cv.getContext('2d');
    this.hist = new Float32Array(HIST); this.head = 0;
    this.lvl = 0; this.tgt = 0; this.commit = 0; this.ph = 0;
    this.mode = cv.dataset.mode || 'line';
    this.on = false; this.press = false; this.hover = false;
    this.t = 0; this.burst = 0; this.peak = 0;
    this.w = 0; this.h = 0; this.dpr = 0;
    this.C = { accent: TOK('accent'), rule: TOK('rule'), ink: TOK('ink'), bg: TOK('bg') };
    this.claimRule = cv.closest('.scene')?.querySelector('.claim [data-emph]');
  }
  measure() {
    const r = this.cv.getBoundingClientRect();
    if (!r.width || !r.height) return false;
    const dpr = Math.min(devicePixelRatio || 1, 2);
    if (Math.abs(r.width - this.w) < .5 && Math.abs(r.height - this.h) < .5 && dpr === this.dpr)
      return true;
    this.w = r.width; this.h = r.height; this.dpr = dpr;
    this.cv.width = Math.round(r.width * dpr); this.cv.height = Math.round(r.height * dpr);
    this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    return true;
  }
  /* speech-like envelope: bursts with pauses, never a decorative sine */
  envelope(dt) {
    this.t += dt;
    if (this.t > this.burst) {
      this.burst = this.t + .09 + Math.random() * .16;
      this.peak = Math.random() < .18 ? .05 + Math.random() * .1 : .34 + Math.random() * .62;
    }
    return this.peak;
  }
  step(dt) {
    if (this.mode === 'commit') {
      /* ~5.5 s to fill, ~2.4 s to fall back. Asymmetric on purpose: committing
         should cost real time, and backing out should not feel like a slap. The
         accumulator is never reset on release, so two short holds add up. */
      this.commit = clamp01(this.commit + (this.press ? dt / 5.5 : -dt / 2.4));
      this.tgt = this.commit;
    } else {
      this.tgt = (this.press || this.hover || this.auto) ? this.envelope(dt) : 0;
    }
    /* asymmetric attack / release — most of why a meter reads as voice */
    const rate = this.tgt > this.lvl ? 26 : 8.5;
    this.lvl += (this.tgt - this.lvl) * Math.min(1, rate * dt);
    this.head = (this.head + 1) % HIST;
    this.hist[this.head] = this.lvl;
    this.ph += dt * 7.5;
  }
  draw() {
    const c = this.ctx, w = this.w, h = this.h;
    if (!w || !h) return;
    c.clearRect(0, 0, w, h);
    if (this.mode === 'commit') {
      const cx = w / 2, cy = h / 2, rad = Math.min(w, h) * .29;
      c.beginPath(); c.arc(cx, cy, rad, 0, Math.PI * 2);
      c.strokeStyle = this.C.rule; c.lineWidth = 1.3; c.stroke();
      if (this.commit > 0) {
        c.globalAlpha = .10 * this.commit;
        c.beginPath(); c.arc(cx, cy, rad, 0, Math.PI * 2);
        c.fillStyle = this.C.accent; c.fill(); c.globalAlpha = 1;
        c.beginPath();
        c.arc(cx, cy, rad, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * this.commit);
        c.strokeStyle = this.C.accent; c.lineWidth = 2.4; c.lineCap = 'round'; c.stroke();
        c.lineCap = 'butt';
      }
      return;
    }
    /* ONE line, and it is the same line at rest and in flight. There used to be
       a grey hairline underneath waiting to be replaced by an accent wave, and
       the hairline read as exactly what it looked like: a divider. Now the
       carrier wave is always drawn — at silence every sample is zero, so it is
       a dead-straight accent rule that does not move. Speak and the same line
       starts carrying your voice. Nothing appears, nothing swaps. */
    const mid = h / 2, n = Math.max(180, (w / 2) | 0), lvl = this.lvl;
    const wake = Math.min(1, lvl / .06);
    c.beginPath();
    for (let i = 0; i < n; i++) {
      const t = i / (n - 1), x = t * w;
      const s = this.hist[(this.head - ((t * 132) | 0) + HIST * 3) % HIST];
      const env = Math.sin(Math.PI * t);             /* pinned at both ends */
      const carrier = Math.sin(t * Math.PI * 28 - this.ph) * .72
                    + Math.sin(t * Math.PI * 46 - this.ph * 1.7) * .28;
      const y = mid + carrier * s * env * (h * .40);
      i ? c.lineTo(x, y) : c.moveTo(x, y);
    }
    c.strokeStyle = this.C.accent; c.lineJoin = 'round';
    /* full colour at rest, because at 3.87:1 accent only clears the 3:1 mark
       floor at full strength — so it stays quiet by being THIN, not by being
       faded */
    c.lineWidth = 1.6 + 1.0 * wake;
    c.stroke();
  }
}
const lines = $$('.linec').map(cv => { const L = new Line(cv); cv._line = L; return L; });

/* ════════════════════════ the settle — a spring, not a duration ═══════════
   Constants live in spikes/flutter-showcase/lib/scenes/settle_scene.dart and
   that file is the source of truth (D20). What is decided is the shape:
   underdamped, one small overshoot, then still. */
const K = 205, CD = 21, M = 1;
class Spring {
  constructor(x) { this.x = x; this.v = 0; this.t = x; }
  retarget(t, v) { this.t = t; if (v !== undefined) this.v = v; }
  step(dt) {
    const n = Math.max(1, Math.ceil(dt / .004)), h = dt / n;
    for (let i = 0; i < n; i++) {
      const a = (-K * (this.x - this.t) - CD * this.v) / M;
      this.v += a * h; this.x += this.v * h;
    }
    return Math.abs(this.x - this.t) < .4 && Math.abs(this.v) < 6;
  }
}
class Settle {
  constructor(root) {
    this.root = root;
    this.mark = $('[data-mark]', root); this.hint = $('[data-hint]', root);
    this.tgts = $$('.tgt', root);
    this.slot = root.closest('.scene')?.querySelector('[data-slot]');
    this.undo = root.closest('.scene')?.querySelector('[data-undo]');
    this.undo?.addEventListener('click', () => this.rewind());
    this.sx = new Spring(0); this.sy = new Spring(0);
    this.drag = false; this.done = false; this.choice = null; this.commitAt = 0;
    this.mark.addEventListener('pointerdown', e => this.grab(e));
    addEventListener('pointermove', e => this.move(e));
    addEventListener('pointerup', () => this.release());
    this.tgts.forEach(t => t.addEventListener('click', () => {
      if (this.done) return;
      this.choice = t.dataset.tgt; this.aim(); this.commitAt = performance.now() + 620;
    }));
  }
  centre(el) {
    const a = this.root.getBoundingClientRect(), b = el.getBoundingClientRect();
    return { x: b.left - a.left + b.width / 2, y: b.top - a.top + b.height / 2 };
  }
  /* put the mark back where it was thrown from and unwrite the day */
  rewind() {
    clearTimeout(this.goT);
    this.undo?.classList.remove('on');
    this.reset();
  }
  reset() {
    clearTimeout(this.goT);
    this.undo?.classList.remove('on');
    const r = this.root.getBoundingClientRect();
    if (!r.width) return;
    this.home = { x: r.width / 2, y: r.height / 2 };
    this.sx = new Spring(this.home.x); this.sy = new Spring(this.home.y);
    this.done = false; this.choice = null; this.commitAt = 0; this.drag = false;
    this.mark.classList.remove('committed', 'is-broken');
    this.tgts.forEach(t => t.classList.remove('hot'));
    if (this.hint) { this.hint.textContent = 'drag it, or throw it'; this.hint.style.opacity = 1; }
    if (this.slot) this.slot.className = 'm none';
    this.place();
  }
  place() {
    const m = this.mark.offsetWidth / 2 || 17;
    this.mark.style.left = (this.sx.x - m) + 'px';
    this.mark.style.top = (this.sy.x - m) + 'px';
  }
  grab(e) {
    if (this.done) return;
    e.preventDefault();
    this.drag = true; this.commitAt = 0;
    this.lx = e.clientX; this.ly = e.clientY; this.vx = 0; this.vy = 0;
    this.lt = performance.now();
    this.mark.setPointerCapture?.(e.pointerId);
    if (this.hint) this.hint.style.opacity = .35;
  }
  move(e) {
    if (!this.drag) return;
    const now = performance.now(), dt = Math.max(1, now - this.lt) / 1000;
    this.vx = (e.clientX - this.lx) / dt; this.vy = (e.clientY - this.ly) / dt;
    this.lx = e.clientX; this.ly = e.clientY; this.lt = now;
    this.sx.x += this.vx * dt; this.sy.x += this.vy * dt;
    const r = this.root.getBoundingClientRect();
    this.sx.x = Math.max(18, Math.min(r.width - 18, this.sx.x));
    this.sy.x = Math.max(18, Math.min(r.height - 18, this.sy.x));
    this.hot(); this.place();
  }
  hot() {
    let best = null, bd = 1e9;
    for (const t of this.tgts) {
      const c = this.centre(t), d = Math.hypot(c.x - this.sx.x, c.y - this.sy.x);
      if (d < bd) { bd = d; best = t; }
    }
    const near = bd < 210 ? best : null;
    this.tgts.forEach(t => t.classList.toggle('hot', t === near));
    this.near = near;
    this.mark.classList.toggle('is-broken', near?.dataset.tgt === 'broken');
  }
  release() {
    if (!this.drag) return;
    this.drag = false; this.hot();
    this.choice = this.near ? this.near.dataset.tgt : null;
    /* the fling velocity goes straight into the spring: a hard throw overshoots
       and a gentle one does not */
    this.aim(this.vx, this.vy);
    if (this.choice) {
      this.commitAt = performance.now() + 620;
      if (this.hint) this.hint.textContent = "change your mind — it redirects, it doesn't restart";
    }
  }
  aim(vx, vy) {
    const c = this.choice
      ? this.centre(this.tgts.find(t => t.dataset.tgt === this.choice)) : this.home;
    this.sx.retarget(c.x, vx); this.sy.retarget(c.y, vy);
    this.mark.classList.toggle('is-broken', this.choice === 'broken');
    this.tgts.forEach(t => t.classList.toggle('hot', t.dataset.tgt === this.choice));
  }
  step(dt) {
    if (this.drag || !this.home) return;
    const a = this.sx.step(dt), b = this.sy.step(dt);
    this.place();
    if (this.commitAt && performance.now() > this.commitAt && a && b && !this.done) {
      this.done = true;
      this.mark.classList.add('committed');
      if (this.slot) this.slot.className = 'm ' + this.choice;
      if (this.hint) {
        this.hint.textContent = this.choice === 'kept' ? 'settled — kept' : 'settled — broken';
        this.hint.style.opacity = 1;
      }
      /* A thrown mark is the only gesture in the product that writes to the
         record, and a throw can miss. So it is not written until the panel
         actually goes — and for those seconds there is a way back. An undo is
         not the app commenting on your day; Principle 3 is about what it says,
         not about whether it lets you correct a slip. */
      if (this.undo) this.undo.classList.add('on');
      clearTimeout(this.goT);
      /* `STEPS[cur].scene` was undefined — the field is `s` — so this never
         fired and the panel never left after a settle. */
      this.goT = setTimeout(() => {
        if (this.undo) this.undo.classList.remove('on');
        if (STEPS[cur].s === 'gate') leave('gone');
      }, 3200);
    }
  }
}
const settles = $$('[data-settle]').map(r => new Settle(r));

/* ════════════════════════ the record strips ════════════════════════
   One fixture, and every screen reads the same one. `k` kept · `b` broken ·
   `u` didn't settle · `K` today. Window 1 runs 28 days from 27 June; window 2
   is twelve days old. Every count printed anywhere on any screen is derived
   from these two strings, so no screen can contradict another. */
const W1 = 'kkbkukkuuuukkkbkukkkkbkkkkkk';   /* 19 kept · 3 broken · 6 unsettled */
const W2 = 'kkkkbkkkkukK';                    /* 10 kept · 1 broken · 1 unsettled */
const NAME = { k: 'kept', b: 'broken', u: 'unsettled', K: 'kept' };
const SETS = {
  w1: { s: W1, from: 1 }, w2: { s: W2, from: 1 }, all: { s: W1 + W2, from: 1 },
  d7: { s: W1.slice(0, 7), labels: ['Wed', 'Thu', 'Fri', 'Sat', 'Sun', 'Mon', 'Tue'] },
};
$$('[data-days]').forEach(strip => {
  const set = SETS[strip.dataset.days]; if (!set) return;
  strip.innerHTML = [...set.s].map((ch, i) => {
    const lab = set.labels ? set.labels[i] : (set.from + i);
    const today = ch === 'K';
    return `<div class="d${today ? ' today' : ''}"><i class="m ${NAME[ch]}"${
      today ? ' style="box-shadow:0 0 0 5px #1D2023"' : ''}></i>
      <span class="dl">${lab}</span></div>`;
  }).join('');
});
/* counts printed on screen, computed rather than typed */
$$('[data-count]').forEach(el => {
  const [set, kind] = el.dataset.count.split(':');
  const s = SETS[set].s;
  el.textContent = kind === 'days' ? s.length
    : [...s].filter(c => NAME[c] === kind).length;
});

/* ════════════════════════ the commit flood ════════════════════════ */
const floods = [];
$$('[data-commit]').forEach(btn => {
  const pane = btn.closest('.pane');
  const flood = $('[data-flood]', pane), msg = $('[data-floodmsg]', pane);
  const word = $('[data-floodword]', pane), cap = $('.cap', btn);
  const inv = $('[data-inv]', pane), src = $('[data-claimsrc]', pane);
  const letgo = $('[data-letgo]', pane);
  const copy = $('[data-claimcopy]', pane), slot = $('[data-invslot]', pane);
  const ring = btn.querySelector('canvas')._line;
  const emph = pane.querySelector('.claim [data-emph]');
  let CX = 0, CY = 0, RAD = 0;
  const place = () => {
    /* the inverted copy is pixel-identical, so its stand-in for the hold button
       takes the button's MEASURED height — a guess here is exactly what made
       the sentence jump once the colour arrived */
    if (slot) slot.style.height = btn.offsetHeight + 'px';
    const b = pane.getBoundingClientRect(), c = btn.querySelector('canvas').getBoundingClientRect();
    if (!b.width) return;
